name: CI 與 GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 單元測試
        run: npm test
      - name: 平衡模擬（只輸出，不擋版）
        run: npm run balance
      - name: 打包
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: 瀏覽器 E2E（原始碼版）
        run: npm run e2e
      - name: 瀏覽器 E2E（打包單檔版）
        run: npm run e2e:dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
